<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 width%3D%22200%22 height%3D%22200%22 viewBox%3D%220 0 24 24%22%3E%3Cpath fill%3D%22%23ff6fa8%22 d%3D%22M6 20q-1.65 0-2.825-1.175T2 16V8q0-1.65 1.175-2.825T6 4h12q1.65 0 2.825 1.175T22 8v8q0 1.65-1.175 2.825T18 20H6ZM6 8h12q.55 0 1.05.125t.95.4V8q0-.825-.588-1.413T18 6H6q-.825 0-1.413.588T4 8v.525q.45-.275.95-.4T6 8Zm-1.85 3.25l11.125 2.7q.225.05.45 0t.425-.2l3.475-2.9q-.275-.375-.7-.613T18 10H6q-.65 0-1.137.338t-.713.912Z%22%2F%3E%3C%2Fsvg%3E" sizes="any" />
<title>Simplest Wallet</title>
<script type="importmap">
{"imports": {
  "@noble/curves/secp256k1": "https://esm.sh/@noble/curves@1.9.7/secp256k1",
  "@noble/curves/utils": "https://esm.sh/@noble/curves@1.9.7/utils",
  "@noble/hashes/sha2": "https://esm.sh/@noble/hashes@1.8.0/sha2",
  "@scure/base": "https://esm.sh/@scure/base@1.2.6"
}}
</script>
<style>
:root { --bg: #fbf3f6; --ink: #2a1020; --mute: #876272; --line: #eed6e0; --acc: #c2255c; --on: #fff; --bad: #c2410c; --ok: #15803d; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1a0f15; --ink: #f8e8ef; --mute: #b08a9c; --line: #3a2330; --acc: #ff6fa8; --on: #1a0f15; --bad: #fb923c; --ok: #4ade80; }
}
* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
main { max-width: 26rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; display: grid; gap: 1.25rem; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .5rem 1rem; color: var(--mute); font-size: .875rem; }
h1 { font: inherit; color: var(--ink); font-weight: 600; }
.bal { font-size: clamp(2.75rem, 14vw, 4rem); font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.bal small { font-size: 1rem; font-weight: 400; color: var(--mute); letter-spacing: 0; }
.mute, summary { color: var(--mute); font-size: .875rem; }
.err { color: var(--bad); font-size: .875rem; }
button { font: inherit; border: 0; border-radius: .5rem; padding: .7rem 1rem; background: var(--acc); color: var(--on); cursor: pointer; transition: transform .1s ease-out; }
button:disabled { opacity: .45; cursor: default; }
button:active:not(:disabled) { transform: scale(.97); }
button.quiet, .tabs button { background: none; color: var(--acc); padding: .4rem .2rem; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.tabs { display: flex; gap: 1.25rem; border-bottom: 1px solid var(--line); }
.tabs button { color: var(--mute); border-radius: 0; margin-bottom: -1px; border-bottom: 2px solid transparent; }
.tabs [aria-pressed="true"] { color: var(--ink); border-color: var(--acc); }
.pill { display: inline-flex; justify-self: start; padding: 3px; gap: 3px; border: 1px solid var(--line); border-radius: 99px; }
.pill button { padding: .3rem .9rem; border-radius: 99px; background: none; color: var(--mute); font-size: .875rem; }
.pill [aria-pressed="true"] { background: var(--acc); color: var(--on); }
.card { border: 1px solid var(--line); border-radius: .75rem; padding: .9rem; display: grid; gap: .6rem; }
.card .addr { border: 0; padding: 0; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
p:empty { display: none; }
.panel { display: grid; gap: .75rem; }
.addr { font: .8rem/1.45 ui-monospace, monospace; word-break: break-all; padding: .75rem; border: 1px solid var(--line); border-radius: .5rem; }
label { display: grid; gap: .3rem; font-size: .875rem; color: var(--mute); }
input { font: inherit; color: var(--ink); background: none; border: 1px solid var(--line); border-radius: .5rem; padding: .65rem .75rem; width: 100%; min-width: 0; }
input:focus { border-color: var(--acc); outline: none; }
.row { display: flex; gap: .5rem; }
details { border-top: 1px solid var(--line); padding-top: 1rem; }
summary { cursor: pointer; }
details > * + * { margin-top: .75rem; }
ul { list-style: none; padding: 0; font-size: .875rem; font-variant-numeric: tabular-nums; }
li { display: flex; justify-content: space-between; padding: .2rem 0; }

/* motion: panels rise in whenever they unhide (tabs, setup → wallet), CSS replays it for free */
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@keyframes float { 0% { opacity: 0; transform: translateY(4px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-1.5rem); } }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
@keyframes pulse { 50% { opacity: .45; } }
.panel, li { animation: rise .35s ease-out backwards; }
li { animation-delay: calc(min(var(--i, 0), 10) * 40ms); }
.bal { position: relative; }
#bal { display: inline-block; transform-origin: left bottom; } /* inline spans ignore transform */
.delta { position: absolute; right: 0; top: .5rem; font-size: 1rem; font-weight: 500; letter-spacing: 0; pointer-events: none; animation: float 1.6s ease-out forwards; }
.delta.in { color: var(--ok); }
.delta.out { color: var(--acc); }
.ok { color: var(--ok); font-size: .875rem; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
button.busy, button.busy:disabled { opacity: 1; cursor: progress; background: linear-gradient(90deg, var(--acc) 33%, color-mix(in srgb, var(--acc), var(--on) 30%) 50%, var(--acc) 67%) 0 0 / 300% 100%; animation: shimmer 1.1s linear infinite; }
.tabs button, .pill button { transition: color .2s, background-color .2s, border-color .2s; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<main>
  <header><h1>Simplest Wallet</h1><div class="pill" id="net" role="group" aria-label="Network"></div></header>
  <p id="note" class="mute" role="status">Connecting…</p>

  <form id="setup" class="panel" hidden>
    <p>One key holds your coins. Delegatee runs the transactions it signs, and renews your coins while you are away.</p>
    <button type="button" id="create">Create a wallet</button>
    <label>Or restore a wallet from its key<input id="key" placeholder="Paste your backup key" autocomplete="off" spellcheck="false"></label>
    <p id="key-note" class="err"></p>
    <button id="restore" hidden>Restore this wallet</button>
  </form>

  <div id="wallet" class="panel" hidden>
    <p class="bal"><span id="bal">0</span> <small>sats</small></p>
    <p id="bal-fiat" class="mute"></p>
    <p id="pending" class="mute"></p>

    <nav class="tabs">
      <button aria-pressed="true" data-tab="receive">Receive</button>
      <button aria-pressed="false" data-tab="send">Send</button>
    </nav>

    <div id="receive" class="panel">
      <div class="pill">
        <button aria-pressed="true" data-addr="ark">Arkade</button>
        <button aria-pressed="false" data-addr="btc">Bitcoin</button>
      </div>
      <div class="card">
        <p id="addr" class="addr"></p>
        <div class="foot"><span id="addr-hint" class="mute"></span><button class="quiet" id="copy">Copy</button></div>
      </div>
    </div>

    <form id="send" class="panel" hidden novalidate>
      <label>To<input id="to" placeholder="Arkade or bitcoin address" autocomplete="off" spellcheck="false"></label>
      <p id="to-hint" class="mute"></p>
      <label>Amount
        <span class="row"><input id="amount" inputmode="numeric" placeholder="sats" autocomplete="off"><button type="button" class="quiet" id="max">Max</button></span>
      </label>
      <p id="send-note" role="status"></p>
      <button id="go" disabled>Send</button>
    </form>

    <details><summary id="coins-sum">No coins</summary><ul id="coins"></ul></details>
    <details id="backup">
      <summary>Backup key</summary>
      <p id="backup-note" class="mute">This key restores your wallet on any device. Anyone with it can spend your coins.</p>
      <p id="secret" class="addr"></p>
      <div class="row"><button class="quiet" id="copy-key">Copy key</button><button class="quiet" id="forget">Use another wallet</button></div>
    </details>
  </div>
</main>

<script type="module">
import { Wallet, destination, newSecret } from './wallet.js'

const $ = (id) => document.getElementById(id)
const sats = (n) => n.toLocaleString('en-US')
const KEY = 'simplestwallet.secret', NET = 'simplestwallet.network'
const store = (f) => { try { return f(localStorage) } catch {} }
const usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' })
let price = 0 // dollars per bitcoin, 0 until mempool.space answers: amounts then show in sats only
const fiat = (n) => (price ? usd.format((n * price) / 1e8) : '')
const amt = (n) => `${sats(n)} sats${price ? ` (${fiat(n)})` : ''}`
let w, addrKind = 'ark', last = '', vtxos = [], total = 0, max = 0

const say = (id, text, bad) => Object.assign($(id), { textContent: text, className: bad ? 'err' : 'mute' })
const note = (text, bad) => say('note', text, bad)
const sendNote = (text, bad) => say('send-note', text, bad)

const calm = matchMedia('(prefers-reduced-motion: reduce)')
const anim = (el, frames, ms = 300) => calm.matches || el.animate(frames, { duration: ms, easing: 'ease-out' })
const pop = (el) => anim(el, [{ opacity: 0, transform: 'scale(.92)' }, { opacity: 1, transform: 'none' }])
const shake = (el) => anim(el, [0, -5, 5, -3, 0].map((x) => ({ transform: `translateX(${x}px)` })), 350)
let shown = 0, raf, loaded = false
// countTo eases the balance from what is on screen to n, picking up mid-count if interrupted
function countTo(n) {
  const from = shown, t0 = performance.now(), ms = calm.matches ? 0 : 1200
  cancelAnimationFrame(raf)
  const step = (t) => {
    const k = ms ? Math.min(1, (t - t0) / ms) : 1
    shown = Math.round(from + (n - from) * (1 - (1 - k) ** 3))
    $('bal').textContent = sats(shown)
    if (k < 1) raf = requestAnimationFrame(step)
  }
  step(t0)
}
function delta(n) {
  if (!n || calm.matches) return
  const s = Object.assign(document.createElement('span'), { className: `delta ${n > 0 ? 'in' : 'out'}`, textContent: `${n > 0 ? '+' : '−'}${sats(Math.abs(n))}` })
  s.onanimationend = () => s.remove()
  $('bal').parentElement.append(s)
  // the number itself bumps and glows green when it grows, pink when it shrinks, then settles
  const color = n > 0 ? 'var(--ok)' : 'var(--acc)'
  anim($('bal'), [{ color, transform: 'scale(1.06)' }, { color, offset: .6 }, {}], 1400)
}

async function open(secret, created) {
  note('Connecting…')
  const [artifact, renewal, boarding] = await Promise.all(
    ['contract/simple_wallet.json', 'contract/renewal.json', 'contract/boarding.json'].map(json))
  w = await new Wallet(secret, config, { artifact, renewal, boarding }).init()
  store((s) => s.setItem(KEY, secret))
  note('')
  $('setup').hidden = true
  $('wallet').hidden = false
  $('secret').textContent = secret
  if (created) {
    $('backup').open = true
    $('backup-note').textContent = 'Save this key now: it is the only way to restore this wallet.'
  }
  showAddress()
  getPrice()
  setInterval(getPrice, 600_000)
  await refresh()
  setInterval(() => document.hidden || refresh(), 4000)
  document.addEventListener('visibilitychange', () => document.hidden || refresh())
}

async function getPrice() {
  try { price = (await fetch('https://mempool.space/api/v1/prices').then((r) => r.json())).USD } catch { return }
  last = ''
  refresh()
}

async function refresh() {
  let coins
  try { coins = await w.coins() } catch { return note('Delegatee is unreachable, retrying…', true) }
  note('')
  const key = JSON.stringify(coins)
  if (key === last) return
  last = key
  const { deposits } = coins
  vtxos = coins.vtxos
  const prev = total
  total = vtxos.reduce((n, v) => n + v.amount, 0)
  const arriving = deposits.reduce((n, v) => n + v.amount, 0)
  if (loaded) delta(total - prev)
  loaded = true
  countTo(total)
  $('pending').classList.toggle('pulse', arriving > 0)
  $('bal-fiat').textContent = fiat(total)
  $('pending').textContent = arriving ? `${amt(arriving)} arriving from bitcoin` : total ? '' : 'Receive some bitcoin to get started.'
  $('coins-sum').textContent = vtxos.length ? `${vtxos.length} coin${vtxos.length > 1 ? 's' : ''}` : 'No coins'
  $('coins').replaceChildren(...vtxos.map((v, i) => {
    const li = document.createElement('li')
    li.style.setProperty('--i', i)
    li.textContent = amt(v.amount)
    return li
  }))
  check()
}

function showAddress() {
  const ark = addrKind === 'ark'
  $('addr').textContent = ark ? w.address : w.boardingAddress
  anim($('addr'), [{ opacity: 0 }, { opacity: 1 }], 250)
  $('addr-hint').textContent = ark ? 'For Arkade wallets: arrives at once.' : 'For any bitcoin wallet: joins your balance after one confirmation.'
  document.querySelectorAll('[data-addr]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.addr === addrKind))
}

// check names the send button's action and returns what blocks it
function check() {
  const to = $('to').value.trim(), amount = Number($('amount').value)
  let problem = '', offchain = true, plan
  if (to) {
    try {
      offchain = destination(to, w.network, w.server).offchain
    } catch (e) {
      if (to.length > 20) problem = e.message.includes('server') ? 'This address belongs to another Arkade server.' : 'This is not a valid address.'
    }
  }
  const fee = offchain ? 0 : w.config.withdrawFeeMax
  max = Math.max(0, total - fee)
  if (!problem && $('amount').value && !(Number.isInteger(amount) && amount > 0)) problem = 'Enter a whole number of sats.'
  if (!problem && amount > max) problem = `You can send up to ${amt(max)} right now.`
  if (!problem && amount > 0) try { plan = w.plan(vtxos, amount, offchain) } catch (e) { problem = e.message }
  // the button names the amount the contract checks: a leftover too small to keep is paid too
  const extra = plan ? plan.amount - amount : 0
  $('to-hint').textContent = [fee && `Leaves with the next batch. Fees up to ${amt(fee)}.`, extra && `Includes ${amt(extra)} left over, too few to keep.`].filter(Boolean).join(' ')
  const ok = to && plan && !problem
  if ($('go').classList.contains('busy')) return problem // a send is running: leave its button alone
  $('go').disabled = !ok
  $('go').textContent = ok ? `Send ${amt(plan.amount)}` : 'Send'
  return problem
}

async function send(e) {
  e.preventDefault()
  const go = $('go')
  go.disabled = true
  go.classList.add('busy')
  try {
    go.textContent = 'Signing…'
    const spend = await w.send($('to').value, Number($('amount').value))
    go.textContent = 'Sending…'
    for (;;) {
      await new Promise((r) => setTimeout(r, 1500))
      const s = await w.spendStatus(spend.id)
      if (s.status === 'done' && !s.sent) throw new Error('A renewal took these coins first. Nothing was sent: send again.')
      if (s.status === 'done') break
      if (/onchain/.test(s.error)) throw new Error('This server does not send to bitcoin addresses yet. Nothing was sent.')
      if (s.status !== 'active') throw new Error(`The send ${s.status}${s.error ? `: ${s.error}` : ''}. Nothing was sent.`)
    }
    $('send').reset()
    Object.assign($('send-note'), { textContent: `✓ Sent ${amt(spend.amount)}.`, className: 'ok' })
    pop($('send-note'))
    refresh()
  } catch (err) {
    sendNote(err.message, true)
    shake($('send-note'))
  }
  go.classList.remove('busy')
  check()
}

async function copy(button, text) {
  await navigator.clipboard?.writeText(text)
  const label = button.textContent
  button.textContent = 'Copied'
  setTimeout(() => (button.textContent = label), 1200)
}

document.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => {
  document.querySelectorAll('[data-tab]').forEach((t) => t.setAttribute('aria-pressed', t === b))
  $('receive').hidden = b.dataset.tab !== 'receive'
  $('send').hidden = b.dataset.tab !== 'send'
  if (b.dataset.tab === 'send') $('to').focus()
}))
document.querySelectorAll('[data-addr]').forEach((b) => (b.onclick = () => { addrKind = b.dataset.addr; showAddress() }))
$('copy').onclick = () => copy($('copy'), $('addr').textContent)
$('copy-key').onclick = () => copy($('copy-key'), $('secret').textContent)
$('to').oninput = $('amount').oninput = () => sendNote(check(), true)
$('max').onclick = () => { check(); $('amount').value = max; sendNote(check(), true) }
$('send').onsubmit = send

const fail = (e) => note(`${e.message}. Reload to try again.`, true)
const typedKey = () => $('key').value.replace(/\s+/g, '').toLowerCase()
$('key').oninput = () => {
  const k = typedKey(), ok = /^[0-9a-f]{64}$/.test(k)
  $('restore').hidden = !ok
  $('key-note').textContent = ok || k.length < 64 ? '' : 'A backup key is 64 characters, 0 to 9 and a to f.'
}
$('create').onclick = () => open(newSecret(), true).catch(fail)
$('setup').onsubmit = (e) => { e.preventDefault(); if (!$('restore').hidden) open(typedKey()).catch(fail) }
$('forget').onclick = () => {
  if ($('forget').dataset.armed) { store((s) => s.removeItem(KEY)); return location.reload() }
  $('forget').dataset.armed = 1
  $('forget').textContent = 'Click again to forget this key here'
  setTimeout(() => { delete $('forget').dataset.armed; $('forget').textContent = 'Use another wallet' }, 4000)
}

const json = (p) => fetch(p).then((r) => r.json())
const networks = await json('networks.json')
// ponytail: the first preset is the default on the web, regtest when served locally
let net = store((s) => s.getItem(NET))
if (!(net in networks)) net = location.hostname === 'localhost' ? 'regtest' : Object.keys(networks)[0]
const config = networks[net]
$('net').replaceChildren(...Object.keys(networks).map((n) => {
  const b = Object.assign(document.createElement('button'), { textContent: n })
  b.setAttribute('aria-pressed', n === net)
  return b
}))
$('net').onclick = (e) => { if (e.target.textContent in networks) { store((s) => s.setItem(NET, e.target.textContent)); location.reload() } }

const secret = store((s) => s.getItem(KEY))
if (secret) open(secret).catch(fail)
else { note(''); $('setup').hidden = false }
</script>
