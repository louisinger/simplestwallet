<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simplest Wallet</title>
<script type="importmap">
{"imports": {
  "@noble/curves/secp256k1": "https://esm.sh/@noble/curves@1.9.7/secp256k1",
  "@noble/hashes/sha2": "https://esm.sh/@noble/hashes@1.8.0/sha2",
  "@scure/base": "https://esm.sh/@scure/base@1.2.6"
}}
</script>
<style>
:root { --bg: #fbf3f6; --ink: #2a1020; --mute: #876272; --line: #eed6e0; --acc: #c2255c; --on: #fff; --bad: #c2410c; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1a0f15; --ink: #f8e8ef; --mute: #b08a9c; --line: #3a2330; --acc: #ff6fa8; --on: #1a0f15; --bad: #fb923c; }
}
* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
main { max-width: 26rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; display: grid; gap: 1.25rem; }
header { display: flex; justify-content: space-between; color: var(--mute); font-size: .875rem; }
h1 { font: inherit; color: var(--ink); font-weight: 600; }
.bal { font-size: clamp(2.75rem, 14vw, 4rem); font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.bal small { font-size: 1rem; font-weight: 400; color: var(--mute); letter-spacing: 0; }
.mute, summary { color: var(--mute); font-size: .875rem; }
.err { color: var(--bad); font-size: .875rem; }
button { font: inherit; border: 0; border-radius: .5rem; padding: .7rem 1rem; background: var(--acc); color: var(--on); cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
button.quiet, .tabs button { background: none; color: var(--acc); padding: .4rem .2rem; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.tabs { display: flex; gap: 1.25rem; border-bottom: 1px solid var(--line); }
.tabs button { color: var(--mute); border-radius: 0; margin-bottom: -1px; border-bottom: 2px solid transparent; }
.tabs [aria-pressed="true"] { color: var(--ink); border-color: var(--acc); }
.pill { display: inline-flex; justify-self: start; padding: 3px; gap: 3px; border: 1px solid var(--line); border-radius: 99px; }
.pill button { padding: .3rem .9rem; border-radius: 99px; background: none; color: var(--mute); font-size: .875rem; }
.pill [aria-pressed="true"] { background: var(--acc); color: var(--on); }
.card { border: 1px solid var(--line); border-radius: .75rem; padding: .9rem; display: grid; gap: .6rem; }
.card .addr { border: 0; padding: 0; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
p:empty { display: none; }
.panel { display: grid; gap: .75rem; }
.addr { font: .8rem/1.45 ui-monospace, monospace; word-break: break-all; padding: .75rem; border: 1px solid var(--line); border-radius: .5rem; }
label { display: grid; gap: .3rem; font-size: .875rem; color: var(--mute); }
input { font: inherit; color: var(--ink); background: none; border: 1px solid var(--line); border-radius: .5rem; padding: .65rem .75rem; width: 100%; min-width: 0; }
input:focus { border-color: var(--acc); outline: none; }
.row { display: flex; gap: .5rem; }
details { border-top: 1px solid var(--line); padding-top: 1rem; }
summary { cursor: pointer; }
details > * + * { margin-top: .75rem; }
ul { list-style: none; padding: 0; font-size: .875rem; font-variant-numeric: tabular-nums; }
li { display: flex; justify-content: space-between; padding: .2rem 0; }
li span + span { color: var(--mute); }
</style>

<main>
  <header><h1>Simplest Wallet</h1><span id="net"></span></header>
  <p id="note" class="mute" role="status">Connecting…</p>

  <form id="setup" class="panel" hidden>
    <p>One key holds your coins. Delegatee runs the transactions it signs, and renews your coins while you are away.</p>
    <button type="button" id="create">Create a wallet</button>
    <label>Or restore a wallet from its key<input id="key" placeholder="Paste your backup key" autocomplete="off" spellcheck="false"></label>
    <p id="key-note" class="err"></p>
    <button id="restore" hidden>Restore this wallet</button>
  </form>

  <div id="wallet" class="panel" hidden>
    <p class="bal"><span id="bal">0</span> <small>sats</small></p>
    <p id="pending" class="mute"></p>

    <nav class="tabs">
      <button aria-pressed="true" data-tab="receive">Receive</button>
      <button aria-pressed="false" data-tab="send">Send</button>
    </nav>

    <div id="receive" class="panel">
      <div class="pill">
        <button aria-pressed="true" data-addr="ark">Ark</button>
        <button aria-pressed="false" data-addr="btc">Bitcoin</button>
      </div>
      <div class="card">
        <p id="addr" class="addr"></p>
        <div class="foot"><span id="addr-hint" class="mute"></span><button class="quiet" id="copy">Copy</button></div>
      </div>
    </div>

    <form id="send" class="panel" hidden novalidate>
      <label>To<input id="to" placeholder="Ark or bitcoin address" autocomplete="off" spellcheck="false"></label>
      <p id="to-hint" class="mute"></p>
      <label>Amount
        <span class="row"><input id="amount" inputmode="numeric" placeholder="sats" autocomplete="off"><button type="button" class="quiet" id="max">Max</button></span>
      </label>
      <p id="send-note" role="status"></p>
      <button id="go" disabled>Send</button>
    </form>

    <details><summary id="coins-sum">No coins</summary><ul id="coins"></ul></details>
    <details id="backup">
      <summary>Backup key</summary>
      <p id="backup-note" class="mute">This key restores your wallet on any device. Anyone with it can spend your coins.</p>
      <p id="secret" class="addr"></p>
      <div class="row"><button class="quiet" id="copy-key">Copy key</button><button class="quiet" id="forget">Use another wallet</button></div>
    </details>
  </div>
</main>

<script type="module">
import { Wallet, destination, newSecret } from './wallet.js'

const $ = (id) => document.getElementById(id)
const sats = (n) => n.toLocaleString('en-US')
const KEY = 'simplestwallet.secret'
const store = (f) => { try { return f(localStorage) } catch {} }
const inTime = (s) => (s < 3600 ? `${Math.ceil(s / 60)} min` : s < 172800 ? `${Math.round(s / 3600)} h` : `${Math.round(s / 86400)} days`)
let w, addrKind = 'ark', last = '', spendable = 0, max = 0

const say = (id, text, bad) => Object.assign($(id), { textContent: text, className: bad ? 'err' : 'mute' })
const note = (text, bad) => say('note', text, bad)
const sendNote = (text, bad) => say('send-note', text, bad)

async function open(secret, created) {
  note('Connecting…')
  const json = (p) => fetch(p).then((r) => r.json())
  const [config, artifact, renewal, boarding] = await Promise.all(
    ['config.json', 'contract/simple_wallet.json', 'contract/renewal.json', 'contract/boarding.json'].map(json))
  w = await new Wallet(secret, config, { artifact, renewal, boarding }).init()
  store((s) => s.setItem(KEY, secret))
  note('')
  $('setup').hidden = true
  $('wallet').hidden = false
  $('net').textContent = w.network
  $('secret').textContent = secret
  if (created) {
    $('backup').open = true
    $('backup-note').textContent = 'Save this key now: it is the only way to restore this wallet.'
  }
  showAddress()
  await refresh()
  setInterval(() => document.hidden || refresh(), 4000)
  document.addEventListener('visibilitychange', () => document.hidden || refresh())
}

async function refresh() {
  let coins
  try { coins = await w.coins() } catch { return note('Delegatee is unreachable, retrying…', true) }
  note('')
  const key = JSON.stringify(coins)
  if (key === last) return
  last = key
  const { vtxos, deposits } = coins
  const total = vtxos.reduce((n, v) => n + v.amount, 0)
  const arriving = deposits.reduce((n, v) => n + v.amount, 0)
  spendable = w.spendable(vtxos).reduce((n, v) => n + v.amount, 0)
  $('bal').textContent = sats(total)
  $('pending').textContent = arriving ? `${sats(arriving)} sats arriving from bitcoin` : total ? '' : 'Receive some bitcoin to get started.'
  $('coins-sum').textContent = vtxos.length ? `${vtxos.length} coin${vtxos.length > 1 ? 's' : ''}` : 'No coins'
  $('coins').replaceChildren(...vtxos.map((v) => {
    const li = document.createElement('li')
    const due = v.expiresAt - w.config.renewalWindow - Date.now() / 1000
    li.append(...[`${sats(v.amount)} sats`, due > 0 ? `renews in ${inTime(due)}` : 'renewing'].map((t) => Object.assign(document.createElement('span'), { textContent: t })))
    return li
  }))
  check()
}

function showAddress() {
  const ark = addrKind === 'ark'
  $('addr').textContent = ark ? w.address : w.boardingAddress
  $('addr-hint').textContent = ark ? 'For Ark wallets: arrives at once.' : 'For any bitcoin wallet: joins your balance after one confirmation.'
  document.querySelectorAll('[data-addr]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.addr === addrKind))
}

// check names the send button's action and returns what blocks it
function check() {
  const to = $('to').value.trim(), amount = Number($('amount').value)
  let problem = '', fee = 0
  if (to) {
    try {
      if (!destination(to, w.network, w.server).offchain) fee = w.config.withdrawFeeMax
    } catch (e) {
      if (to.length > 20) problem = e.message.includes('server') ? 'This address belongs to another Ark server.' : 'This is not a valid address.'
    }
  }
  $('to-hint').textContent = fee ? `Leaves with the next batch. Fees up to ${sats(fee)} sats.` : ''
  max = Math.max(0, spendable - fee)
  if (!problem && $('amount').value && !(Number.isInteger(amount) && amount > 0)) problem = 'Enter a whole number of sats.'
  if (!problem && amount > max) problem = `You can send up to ${sats(max)} sats right now.`
  const ok = to && amount > 0 && !problem
  $('go').disabled = !ok
  $('go').textContent = ok ? `Send ${sats(amount)} sats` : 'Send'
  return problem
}

async function send(e) {
  e.preventDefault()
  const go = $('go')
  go.disabled = true
  try {
    go.textContent = 'Signing…'
    const spend = await w.send($('to').value, Number($('amount').value))
    go.textContent = 'Sending…'
    for (;;) {
      await new Promise((r) => setTimeout(r, 1500))
      const s = await w.spendStatus(spend.id)
      if (s.status === 'done' && !s.sent) throw new Error('A renewal took these coins first. Nothing was sent: send again.')
      if (s.status === 'done') break
      if (/onchain/.test(s.error)) throw new Error('This server does not send to bitcoin addresses yet. Nothing was sent.')
      if (s.status !== 'active') throw new Error(`The send ${s.status}${s.error ? `: ${s.error}` : ''}. Nothing was sent.`)
    }
    $('send').reset()
    sendNote(`Sent ${sats(spend.amount)} sats.`)
    refresh()
  } catch (err) {
    sendNote(err.message, true)
  }
  check()
}

async function copy(button, text) {
  await navigator.clipboard?.writeText(text)
  const label = button.textContent
  button.textContent = 'Copied'
  setTimeout(() => (button.textContent = label), 1200)
}

document.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => {
  document.querySelectorAll('[data-tab]').forEach((t) => t.setAttribute('aria-pressed', t === b))
  $('receive').hidden = b.dataset.tab !== 'receive'
  $('send').hidden = b.dataset.tab !== 'send'
  if (b.dataset.tab === 'send') $('to').focus()
}))
document.querySelectorAll('[data-addr]').forEach((b) => (b.onclick = () => { addrKind = b.dataset.addr; showAddress() }))
$('copy').onclick = () => copy($('copy'), $('addr').textContent)
$('copy-key').onclick = () => copy($('copy-key'), $('secret').textContent)
$('to').oninput = $('amount').oninput = () => sendNote(check(), true)
$('max').onclick = () => { check(); $('amount').value = max; sendNote(check(), true) }
$('send').onsubmit = send

const fail = (e) => note(`${e.message}. Reload to try again.`, true)
const typedKey = () => $('key').value.replace(/\s+/g, '').toLowerCase()
$('key').oninput = () => {
  const k = typedKey(), ok = /^[0-9a-f]{64}$/.test(k)
  $('restore').hidden = !ok
  $('key-note').textContent = ok || k.length < 64 ? '' : 'A backup key is 64 characters, 0 to 9 and a to f.'
}
$('create').onclick = () => open(newSecret(), true).catch(fail)
$('setup').onsubmit = (e) => { e.preventDefault(); if (!$('restore').hidden) open(typedKey()).catch(fail) }
$('forget').onclick = () => {
  if ($('forget').dataset.armed) { store((s) => s.removeItem(KEY)); return location.reload() }
  $('forget').dataset.armed = 1
  $('forget').textContent = 'Click again to forget this key here'
  setTimeout(() => { delete $('forget').dataset.armed; $('forget').textContent = 'Use another wallet' }, 4000)
}

const secret = store((s) => s.getItem(KEY))
if (secret) open(secret).catch(fail)
else { note(''); $('setup').hidden = false }
</script>
